[project]
name = "skillsgit-api"
version = "0.1.0"
description = "Skillsgit marketplace backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Skillsgit" }]

# Phase 0 dependencies. Versions are loose lower bounds; uv lockfile pins exact.
dependencies = [
    # --- Core ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    # --- DB ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # --- Auth ---
    "fastapi-users[sqlalchemy,oauth]>=14.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9",
    # --- Cache / queue ---
    "redis>=5.0",
    "arq>=0.26",
    # --- Storage / payments ---
    "boto3>=1.35",
    "aioboto3>=13.0",
    "stripe>=11.0",
    "nanoid>=2.0",
    # --- Utils ---
    "uuid-utils>=0.9",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "slowapi>=0.1.9",
    "structlog>=24.1",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "email-validator>=2.2",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "faker>=30.0",
    "polyfactory>=2.18",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── uv ────────────────────────────────────────────────────────────────
[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "faker>=30.0",
    "polyfactory>=2.18",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

# ── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Per 01-tech-stack-and-repo.md — strict-ish rule set.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "N",   # pep8-naming
    "A",   # builtins shadowing
    "PT",  # pytest style
    "RET", # return statements
    "SIM", # simplifications
    "TCH", # type-checking imports
    "TID", # tidy imports
    "PL",  # pylint
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length (handled by formatter)
    "PLR0913", # too many args (FastAPI deps)
    "S101",   # assert (allowed in tests)
    "S104",   # binding to 0.0.0.0 (docker)
    "PLR2004", # magic value (too noisy for HTTP codes etc)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S", "PLR2004", "PT011"]
# Per-module tests (e.g. src/occupations/tests/) sit inside the package
# tree so pytest can target them with `pytest src/<mod>/tests/`. They
# need the same dispensations as the top-level `tests/` plus a few that
# only apply to integration-style tests (in-function imports for
# late-binding fixtures, broad excepts, TYPE_CHECKING moves).
"src/*/tests/**/*" = [
    "S", "PLR2004", "PT011", "PLC0415", "TC001", "TC002", "TC003",
    "E402", "SIM105", "S110", "PLW0108", "PLR0911", "PLR0912",
]
# Top-level integration tests (tests/integration/) use the same
# conftest patterns as the per-module test suites: env-vars-before-
# imports (E402), late-bound fixture imports inside functions (PLC0415),
# type imports kept at runtime for parameter binding (TC00x). Mirror
# the per-module dispensation so the integration suite stays clean.
"tests/integration/**/*" = [
    "S", "PLR2004", "PT011", "PLC0415", "TC001", "TC002", "TC003",
    "E402", "SIM105", "S110", "PLW0108", "PLR0911", "PLR0912",
    "B007", "B035",
]
"alembic/**/*" = ["E", "F", "I", "N", "PL", "S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # FastAPI / SQLAlchemy decorators are dynamically typed
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "slowapi.*",
    "aiosmtplib.*",
    "frontmatter.*",
    "uuid_utils.*",
    "fastapi_users.*",
    "arq.*",
    "boto3.*",
    "jsonschema.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ── pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]
