id: skillsgit-curated/ai-devops-engineer
name: AI DevOps Engineer
tagline: A graph-linked methodology bundle for production DevOps practice — CI/CD, observability, IaC, incident, security, cost.
description: |
  The AI DevOps Engineer occupation packages 30 cross-linked methodology
  skills covering the full DevOps lifecycle — from pipeline design
  through incident response, observability, infrastructure as code,
  workload identity, supply-chain security, and FinOps. Built on top of
  Skills Git's curated library, every member skill links to its
  neighbours (60 explicit cross-links) so an Obsidian graph view renders
  the day-to-day mental map an on-call SRE actually uses.

  Pair this base occupation with a Persona overlay (Wave 4) to add a
  practitioner's recorded situations, decisions, and outcomes on top of
  the curated methodology.
category: occupations
tags:
  - devops
  - sre
  - kubernetes
  - observability
  - ci-cd
  - iac
  - incident-response

# Vault domain folders (per 03-vault-generation.md §1 and the
# Occupation.domains column from 01-data-model-deltas.md §0006).
# The vault builder writes `domains/<slug>/<member>.md` for each member,
# and the occupation router renders the marketplace grouping in this order.
domains:
  - slug: ci-cd
    name: CI/CD
    sort_order: 1
  - slug: observability
    name: Observability
    sort_order: 2
  - slug: incident
    name: Incident response
    sort_order: 3
  - slug: iac
    name: Infrastructure as code
    sort_order: 4
  - slug: security
    name: Security & secrets
    sort_order: 5
  - slug: cost
    name: Cost
    sort_order: 6
  - slug: platform
    name: Platform & data
    sort_order: 7

# Optional cosmetic counts surfaced on the marketplace detail page.
