# DevOps occupation cross-link recipe — Wave 3, T-08.
#
# Source: team/devops-occupation-slugs.md §Cross-link recipe seed (Wave-1 draft).
#
# Each entry below is applied at build time by scripts/build_devops_vault.py
# to the source skill's frontmatter `links:` array. The vault builder
# (src/vault/builder.py) emits these as a `## Linked notes` footer in
# each .md file plus a structured `links[]` entry in vault.json. Obsidian's
# Graph View picks them up automatically.
#
# Relations:
#   - applies          : the source's methodology applies to the target
#   - extends          : the source extends or refines the target
#   - see-also         : adjacent / cross-reference
# (`contradicts` and `recorded-instance-of` exist in LinkRelation but
#  aren't used in this occupation — no Wave-3 contradictions, and
#  recorded-instance-of is reserved for memory-neuron → base in Wave 4.)
#
# Total: 60 explicit cross-links across 30 members (avg ≈ 2 outbound/skill).
#
# NB: 7 slugs use the published `id` form, not the source filename — the
# Wave-2 publish pipeline strips the `devops-` / `eng-` prefix when the
# frontmatter `id` ships that way. See occupation.yaml for the remap list.

