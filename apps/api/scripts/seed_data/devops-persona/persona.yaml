id: jane-devops-demo/incident-veteran
name: Incident Veteran (sample data)
tagline: |
  Sample DevOps practitioner persona — 7 hand-authored neurons covering
  CI flakes, on-call handoffs, blue/green rollback, cost spikes, secret
  rotation, dashboard cardinality, paging policy.
description: |
  A sample persona shipped alongside the AI DevOps Engineer occupation
  to demonstrate the persona overlay mechanic for the Cycle-1 Layer-C
  demo. NOT a real practitioner's record — every neuron in this
  persona is synthesised sample data. Real personas on the Skills Git
  platform are published by named DevOps engineers and carry their
  actual recorded situations, decisions, and outcomes.

  The 7 neurons in this persona overlay the AI DevOps Engineer
  occupation and cover the demo scenarios QA uses in T-14:

  - Flaky integration tests after a Redis minor upgrade.
  - On-call handoff template (process change).
  - Blue/green rollback at 3am that exposed a runbook bug.
  - AWS cost spike traced to a typo'd backup bucket.
  - Zero-downtime database password rotation across 14 services.
  - Prometheus cardinality cleanup that cut memory 47%.
  - Alert-policy rewrite that cut pages 62%.

